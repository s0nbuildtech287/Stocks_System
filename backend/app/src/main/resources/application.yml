server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: vn-stock-lab-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/stocklab}
    username: ${SPRING_DATASOURCE_USERNAME:postgres}
    password: ${SPRING_DATASOURCE_PASSWORD:postgres123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

app:
  security:
    jwt-secret: ${JWT_SECRET:super_secret_jwt_key_stock_lab_minimum_32_chars_long}
    jwt-expiration-ms: 86400000 # 24 hours
    internal-api-key: ${INTERNAL_KEY:stocklab_internal_secret_recompute_token}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
