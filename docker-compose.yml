version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: stocklab-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stocklab}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-stocklab}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: stocklab-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-stocklab}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres123}
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_key_stock_lab_minimum_32_chars_long}
      INTERNAL_KEY: ${INTERNAL_KEY:-stocklab_internal_secret_recompute_token}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  ingestion:
    build:
      context: ./ingestion
      dockerfile: Dockerfile
    container_name: stocklab-ingestion
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres123}@db:5432/${POSTGRES_DB:-stocklab}
      BACKEND_URL: http://backend:8080
      INTERNAL_KEY: ${INTERNAL_KEY:-stocklab_internal_secret_recompute_token}
    depends_on:
      - db
      - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: stocklab-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080/api/v1}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
